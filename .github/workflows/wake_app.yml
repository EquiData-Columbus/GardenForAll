name: Wake Streamlit App

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:          # Allows manual trigger from GitHub UI

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake up Streamlit app
        run: python wake_app.py

      # Uploads both screenshots so you can download and view them
      # from the Actions run page even if the script crashes
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshot_*.png
          retention-days: 3
